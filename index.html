<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Car Ranking</title>
<style>
  body { font-family: Arial, sans-serif; background:#111; color:#eee; }
  table { border-collapse: collapse; width:100%; margin-top:20px; }
  th, td { padding:10px; border-bottom:1px solid #333; text-align:left; }
  th { background:#222; }
  tr:hover { background:#1a1a1a; }
  .good { color:#4caf50; }
  .bad { color:#f44336; }
</style>
</head>
<body>

<h1>Car Ranking (Fixed & Weighted)</h1>
<p>Sorted by: Reliability → Insurance → Tax → Cost → Size</p>

<table id="carTable">
<thead>
<tr>
  <th>Car</th>
  <th>Reliability</th>
  <th>Insurance</th>
  <th>VED</th>
  <th>£ / 100 miles</th>
  <th>Length (mm)</th>
  <th>Score</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>
const reliabilityScore = {
  "Excellent": 5,
  "Very Good": 4,
  "Good": 3,
  "Average": 2,
  "Unknown": 1
};

const cars = [
  {name:"Kia Sportage", rel:"Excellent", ins:20, ved:190, cost:11.5, size:4515},
  {name:"Mazda CX-5", rel:"Excellent", ins:21, ved:190, cost:12.0, size:4575},
  {name:"Skoda Karoq", rel:"Very Good", ins:18, ved:190, cost:11.8, size:4384},
  {name:"SEAT Ateca", rel:"Very Good", ins:19, ved:190, cost:11.9, size:4381},
  {name:"Nissan Qashqai", rel:"Very Good", ins:20, ved:190, cost:12.2, size:4425},

  {name:"Hyundai Tucson", rel:"Very Good", ins:19, ved:190, cost:12.3, size:4500},
  {name:"Dacia Duster", rel:"Good", ins:13, ved:190, cost:7.8, size:4343},

  {name:"Jeep Avenger", rel:"Average", ins:24, ved:180, cost:8.5, size:4084},
  {name:"MG HS", rel:"Average", ins:25, ved:190, cost:17.4, size:4574},
  {name:"Vauxhall Grandland 1.2", rel:"Average", ins:24, ved:190, cost:13.5, size:4477},

  {name:"MG S5 EV", rel:"Unknown", ins:29, ved:0, cost:4.0, size:4476},
  {name:"OMODA 5", rel:"Unknown", ins:32, ved:190, cost:18.0, size:4400}
];

// scoring function (STRICT priority weighting)
function score(car){
  return (
    reliabilityScore[car.rel] * 1000 +   // dominant
    (50 - car.ins) * 20 +                // strong
    (200 - car.ved) * 2 +                // moderate
    (20 - car.cost) * 10 +               // lower
    car.size / 100                      // minor
  );
}

// compute score
cars.forEach(c => c.score = score(c));

// sort properly
cars.sort((a,b) => b.score - a.score);

// render
const tbody = document.querySelector("#carTable tbody");

cars.forEach(car => {
  const row = `
    <tr>
      <td>${car.name}</td>
      <td>${car.rel}</td>
      <td>${car.ins}</td>
      <td>£${car.ved}</td>
      <td>£${car.cost}</td>
      <td>${car.size}</td>
      <td>${car.score.toFixed(0)}</td>
    </tr>
  `;
  tbody.innerHTML += row;
});
</script>

</body>
</html>
